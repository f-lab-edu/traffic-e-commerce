//shipment.proto
syntax = "proto3";
package com.ecommerce.proto;

option java_multiple_files = true;
option java_package = "com.ecommerce.proto";
option java_outer_classname = "StockChangeMessage";


// 재고 차감 성공 이벤트
message StockDeductEvent {
  string order_uuid = 1;
  repeated DeductItems items = 2;
  int64 deduct_dt = 3;
}


// 재고 부족 이벤트
message StockDeductLackedEvent {
  string order_uuid = 1;
  repeated LackedItems items = 2;
  int64 checked_dt = 3;
}

// 재고 복구 이벤트
message StockRestoredEvent {
  string order_uuid = 1;
  repeated RestoredItems items = 2;
  int64 restored_dt = 3;
}


// --------------------- //


// 재고 차감  상품 정보
message DeductItems {
  string product_uuid = 1;
  int32 deduct_quantity = 2;
  int32 remaining_stock = 3;
}

// 재고 부족 상품 정보
message LackedItems {
  string product_uuid = 1;
  int32 requested_quantity = 2;
  int32 available_stock = 3;
}

// 복구된 상품 정보
message RestoredItems {
  string product_uuid = 1;
  int32 restored_quantity = 2;
  int32 current_stock = 3;
}


// ===== 재고 조회 관련 메시지 =====

// 재고 상태 조회 요청
message InventoryStatusRequest {
  repeated string product_uuids = 1;       // 조회할 상품 UUID 목록
  int64 requested_at = 2;                  // 요청 시간
}

// 재고 상태 조회 응답
message InventoryStatusResponse {
  repeated ProductStockStatus products = 1; // 상품별 재고 상태
  int64 responded_at = 2;                   // 응답 시간
}

// 상품별 재고 상태
message ProductStockStatus {
  string product_uuid = 1;                 // 상품 UUID
  string product_name = 2;                 // 상품명
  int32 stock_quantity = 3;                // 현재 재고 수량
  bool is_available = 4;                   // 구매 가능 여부
  int64 last_updated = 5;                  // 마지막 업데이트 시간
}